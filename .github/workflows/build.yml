name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'manifest.json']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.Tis/Jellyfin.Plugin.Tis.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: tis-plugin-dev
          path: out/Jellyfin.Plugin.Tis.dll
